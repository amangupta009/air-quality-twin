spring.application.name=air-quality-twin

# ---------------------------------------------------------------------------
# Database (PostgreSQL). Values come from environment variables when set,
# falling back to the local docker-compose defaults. NEVER put real secrets
# in this file for anything beyond local development.
# ---------------------------------------------------------------------------
spring.datasource.url=jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:airquality}
spring.datasource.username=${DB_USER:aq_user}
spring.datasource.password=${DB_PASSWORD:aq_pass}

# ddl-auto=update creates/updates tables from JPA entities (fine for dev).
# Production would use versioned SQL migrations instead (documented trade-off).
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false

# ---------------------------------------------------------------------------
# MQTT broker (Mosquitto in docker-compose)
# ---------------------------------------------------------------------------
mqtt.broker-uri=${MQTT_BROKER:tcp://localhost:1883}
mqtt.client-id=air-quality-twin-backend
mqtt.topic-prefix=sensors

# ---------------------------------------------------------------------------
# Sensor source mode.
#   simulator -> backend generates realistic readings and publishes them to
#                MQTT itself (no physical sensor needed).
#   hardware  -> backend only listens; a real device (ESP32) publishes to the
#                same topics. Swapping is just changing this one property.
# ---------------------------------------------------------------------------
sensor.mode=${SENSOR_MODE:simulator}
sensor.default-room=room101

# Simulator tuning (model-time acceleration lets a 30-minute CO2 story play
# out in ~2 real minutes during demos).
sensor.simulator.interval-ms=5000
sensor.simulator.time-factor=5
sensor.simulator.capacity=8
sensor.simulator.outdoor-co2-ppm=420
sensor.simulator.infiltration-ach=0.5
sensor.simulator.ventilation-ach=6.0

# ---------------------------------------------------------------------------
# Alert thresholds (module 4)
# ---------------------------------------------------------------------------
thresholds.co2-ppm=1000
thresholds.pm25-ugm3=35

# ---------------------------------------------------------------------------
# Operational evidence (logs/metrics endpoints required by acceptance gates)
# ---------------------------------------------------------------------------
management.endpoints.web.exposure.include=health,info,metrics
logging.level.com.capstone.airquality=INFO
